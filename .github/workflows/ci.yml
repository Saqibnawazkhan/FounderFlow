name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matched to `engines.node` in package.json, which is not a declaration
      # about the deploy target but IS the deploy target: Vercel reads that field
      # and it overrides the Node.js Version chosen in Project Settings. This was
      # "20" until the 2026-10 go-live audit (prodready-017) — a line that left
      # support on 2026-04-30 and that Vercel stopped deploying on 2026-10-01,
      # while every local build and smoke run happened on Node 24. Every Node pin
      # in the repo has to name the same major or CI proves nothing about the
      # deployed artifact; tests/ops/node-runtime-pin.test.ts fails if one drifts.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `npm install` (not `npm ci`) tolerates the known npm bug where
      # optional + cpu-mismatched packages (e.g. @rolldown/binding-wasm32-wasi)
      # reference transitive deps like @emnapi/core@1.10.0 but the lock file
      # omits the corresponding package entry — `npm ci` fails strict
      # validation, `npm install` reconciles silently. `--no-audit --no-fund`
      # keeps the log clean.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Static checks that don't need a DB connection but catch the class
      # of bug that took the site down on 2026-07-03:
      #   `prisma validate` fails if schema.prisma is malformed or the
      #     migrations directory is inconsistent with the schema.
      #   `prisma format --check` fails if someone hand-edited the schema
      #     without formatting.
      # The real guardrail is scripts/vercel-build.mjs which runs
      # `prisma migrate deploy` during the actual production build; this
      # is just an earlier signal.
      - name: Prisma schema check
        run: |
          npx prisma validate
          npx prisma format --check

      - name: Type check
        run: npm run typecheck

      # The unit suite is all pure-function / jsdom — no DB needed. Without
      # this step a regression in a tested schema/parser/permission helper
      # could merge to main green, which is exactly what CLAUDE.md's
      # "Verification before pushing" list (typecheck && test && build) is
      # meant to prevent.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # Apply migrations to STAGING on every merge to main.
  #
  # WHY THIS JOB EXISTS: .env.staging.example has said "CI should run migrations
  # against staging on every merge to main" since it was written, and nothing
  # ever did. Staging was designed and never provisioned, so production has been
  # the first environment every migration ever touched.
  #
  # WHY IT IS ALLOWED TO SKIP: staging genuinely does not exist yet. A job that
  # fails on every merge until someone creates a Supabase project would be
  # switched off within a week, and then it would not be there on the day
  # staging does appear. scripts/db-staging.mjs exits 78 (EX_CONFIG) for "not
  # provisioned", which is distinct from any failure, so the step reports the
  # skip and passes. The moment both secrets exist, this starts migrating for
  # real with no further edit.
  #
  # Repo secrets to add (Settings -> Secrets and variables -> Actions):
  #   STAGING_DATABASE_URL  pooler URL, port 6543  (runtime shape)
  #   STAGING_DIRECT_URL    direct connection, port 5432 (migrations)
  # They are named STAGING_* on purpose: the wrapper reads those exact names and
  # never the ambient DATABASE_URL, so this job cannot inherit production.
  staging-migrate:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply migrations to staging (skips cleanly if not provisioned)
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          set +e
          npm run db:migrate:staging
          code=$?
          set -e
          if [ "$code" -eq 78 ]; then
            echo "::notice title=Staging not provisioned::No STAGING_DATABASE_URL / STAGING_DIRECT_URL secret. See .env.staging.example for the runbook. Not a failure."
            exit 0
          fi
          exit "$code"
